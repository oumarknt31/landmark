app = "landmark-python"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  HF_HOME = "/app/.model_cache"
  SENTENCE_TRANSFORMERS_HOME = "/app/.model_cache"

[http_service]
  internal_port = 8000
  force_https = true
  # Sentence-transformers takes ~5s to load on cold start. Keep at least one
  # machine warm to avoid that latency on first user search.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.health]
      grace_period = "30s"
      interval = "30s"
      method = "GET"
      timeout = "10s"
      path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
