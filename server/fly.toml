app = "landmark-gateway"
primary_region = "ewr"

[build]

[env]
  PORT = "8080"
  EXPLAIN_RATE_CAPACITY = "60"
  EXPLAIN_RATE_REFILL = "60"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
